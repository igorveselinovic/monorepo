
version: 2

models:
  - name: mart_usage_events
    description: "Mart table for Android app usage events"
    columns:
      - name: usage_event_id
        description: "The natural primary key from the raw data source"
        data_type: integer
        data_tests:
          - unique
          - not_null
      - name: usage_event_start_timestamp
        description: "The start time of the app usage event (i.e, when the app was opened)"
        data_type: integer
        data_tests:
          - not_null
      - name: usage_event_end_timestamp
        description: "The end time of the app usage event (i.e, when the app was closed)"
        data_type: integer
        data_tests:
          - not_null
      - name: app_name
        description: "The name of the app that was being used"
        data_type: string
        data_tests:
          - not_null
      - name: app_package_name
        description: "The package name of the app that was being used"
        data_type: string
        data_tests:
          - not_null
      - name: app_class_name
        description: "The name of the class withing the app that was being used"
        data_type: string
        data_tests:
          - not_null

  - name: mart_unlock_events
    description: "Mart table for Android unlock events"
    columns:
      - name: unlock_event_id
        description: "The natural primary key from the raw data source"
        data_type: integer
        data_tests:
          - unique
      - name: unlock_event_timestamp
        description: "The time of the app unlock event (i.e, when the device was unlocked)"
        data_type: integer
        data_tests:
          - not_null
